name: Update README charts

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/readme-charts.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-charts
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate 30-day activity graph
        uses: maurodesouza/github-readme-activity-graph-action@6411849745757299611a795fef822a31ca8d1d02 # v1
        with:
          username: ${{ github.repository_owner }}
          options: days=30&bg_color=1F222E&color=F8D866&line=F85D7F&point=FFFFFF&hide_border=true
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish charts to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
          jekyll: false
          commit_message: "chore: update README charts"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
